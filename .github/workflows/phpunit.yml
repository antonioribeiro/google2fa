name: PHPUnit

on:
  push:
    branches:
      - '*.x'
  pull_request:
    branches:
      - '*.x'

jobs:
  test:
    runs-on: ubuntu-latest
    # PHP 8.6 is still in beta — don't let its inherent instability block the matrix.
    continue-on-error: ${{ matrix.experimental == true }}

    name: PHP ${{ matrix.php }} / PHPUnit ${{ matrix.phpunit }}${{ matrix.coverage && ' / coverage' || '' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 7.4 — PHPUnit 9 only (10+ requires PHP 8.1+)
          - { php: '7.4', phpunit: '^9.0' }

          # PHP 8.0 — PHPUnit 9 only (10+ requires PHP 8.1+)
          - { php: '8.0', phpunit: '^9.0' }

          # PHP 8.1 — PHPUnit 9 and 10
          - { php: '8.1', phpunit: '^9.0' }
          - { php: '8.1', phpunit: '^10.0' }

          # PHP 8.2 — PHPUnit 10 and 11
          - { php: '8.2', phpunit: '^10.0' }
          - { php: '8.2', phpunit: '^11.0' }

          # PHP 8.3 — PHPUnit 11 and 12
          - { php: '8.3', phpunit: '^11.0' }
          - { php: '8.3', phpunit: '^12.0' }

          # PHP 8.4 — PHPUnit 12 and 13
          # The PHPUnit 13 row also computes coverage for Codecov.
          - { php: '8.4', phpunit: '^12.0' }
          - { php: '8.4', phpunit: '^13.0', coverage: 'pcov' }

          # PHP 8.5 — PHPUnit 12 and 13
          - { php: '8.5', phpunit: '^12.0' }
          - { php: '8.5', phpunit: '^13.0' }

          # PHP 8.6 (beta) — PHPUnit 12 and 13. Marked experimental until the
          # toolchain (Psalm in particular) declares 8.6 support.
          - { php: '8.6', phpunit: '^12.0', experimental: true }
          - { php: '8.6', phpunit: '^13.0', experimental: true }

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: ${{ matrix.coverage || 'none' }}
          tools: composer:v2

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Pin PHPUnit version
        run: composer require --dev --no-update "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Configure platform for PHP 8.6 (beta)
        if: matrix.php == '8.6'
        run: composer config platform.php 8.5.0

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: List installed dependencies
        run: composer show -D

      - name: Run tests
        run: |
          flags="--fail-on-skipped"
          if [ -n "${{ matrix.coverage }}" ]; then
            flags="$flags --coverage-clover=coverage.xml --coverage-filter=src"
          fi
          vendor/bin/phpunit $flags

      - name: Upload coverage to Codecov
        if: matrix.coverage == 'pcov'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # false, not true: fork PRs don't receive secrets.CODECOV_TOKEN, so a
          # true here would hard-fail this job on every external contribution.
          fail_ci_if_error: false
          verbose: true
